# DKMS framework configuration; install as /etc/dkms/framework.conf.d/kernel-key.conf.
#
# Signs DKMS modules with the key their kernel was built with, which that kernel trusts without
# an enrolled MOK. build-kernel leaves each kernel's build tree, private key included, at
# /usr/src/linux-<version>; the headers package carries no key. Kernels without such a tree,
# like the distribution's, keep DKMS's own key. DKMS sources this file while building for
# $kernelver.
for _tree in /usr/src/linux-*/; do
	if [[ -f ${_tree}certs/signing_key.pem &&
		$(<"${_tree}include/config/kernel.release") == "$kernelver" ]]; then
		mok_signing_key=${_tree}certs/signing_key.pem
		mok_certificate=${_tree}certs/signing_key.x509
	fi
done 2>/dev/null
