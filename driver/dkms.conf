PACKAGE_NAME="pxw3pe"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="pxw3pe"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Kernels without these are skipped instead of failing. DKMS adds LLVM=1 itself for kernels
# built with clang, and its default make command uses Kbuild directly.
BUILD_EXCLUSIVE_CONFIG="CONFIG_RUST CONFIG_DVB_CORE"
